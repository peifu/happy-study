<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>/* 主题预热：避免首屏深色闪烁 */ (function () { try { var t = localStorage.getItem('theme') || 'light'; if (t === 'light' || (t === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)) { document.documentElement.classList.add('light-theme'); } } catch (e) { } })();</script>
    <link rel="icon" type="image/png" href="assets/logo/bear.png">
    <meta name="theme-color" content="#ffb347">
    <title>快乐学习 - 词典</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/learning-assistant.css">
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/learning-assistant.js"></script>
    <style>
        /* ===== 词典 ===== */
        .dict-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            align-items: start;
        }

        .dict-main {
            min-width: 0;
        }

        .dict-card {
            background: var(--card-bg-color);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-soft);
            padding: 26px;
        }

        .dict-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary);
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 20px;
        }

        .dict-search {
            display: flex;
            gap: 12px;
            margin-bottom: 22px;
        }

        .dict-search .form-control {
            flex: 1;
            font-size: 16px;
        }

        .dict-result {
            min-height: 90px;
            line-height: 1.9;
        }

        .dict-empty,
        .dict-hint {
            color: var(--text-secondary);
        }

        .dict-error {
            color: var(--danger);
        }

        /* 英文词典 */
        .en-word {
            font-size: 24px;
            font-weight: 800;
            color: var(--ink-green);
            margin-bottom: 6px;
        }

        .en-trans {
            font-size: 20px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 14px;
        }

        .en-alt-title {
            font-weight: 700;
            color: var(--secondary);
            margin: 12px 0 8px;
        }

        .en-alt {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .en-alt span {
            background: var(--surface-peach);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-pill);
            padding: 4px 12px;
            font-size: 14px;
        }

        .en-head {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }

        .en-ipa {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .en-audios {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 8px 0 10px;
        }

        .en-audio-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-peach);
            border: 1px solid var(--border-subtle);
            color: var(--primary);
            border-radius: var(--radius-pill);
            padding: 3px 12px;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
        }

        .en-audio-btn:hover {
            border-color: var(--primary);
        }

        .en-sec-title {
            font-weight: 700;
            color: var(--secondary);
            margin: 16px 0 8px;
        }

        .en-defs {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .en-def-line {
            line-height: 1.7;
        }

        .pos-tag {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            background: var(--primary);
            border-radius: var(--radius-pill);
            padding: 1px 8px;
            margin-right: 2px;
        }

        .en-example {
            color: var(--text-secondary);
            font-style: italic;
            font-size: 14px;
            margin-top: 2px;
        }

        .dict-src-hint {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 12px;
        }

        /* 汉语词典 */
        .zh-grid {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 26px;
            align-items: start;
        }

        .zh-stroke {
            text-align: center;
        }

        #hanziTarget {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            border: 1px dashed var(--border-subtle);
            border-radius: 16px;
            background: var(--surface-peach);
        }

        .zh-stroke-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 12px;
        }

        .zh-stroke-btns .btn {
            padding: 8px 14px;
            font-size: 14px;
        }

        .zh-char {
            font-size: 40px;
            font-weight: 800;
            color: var(--ink-green);
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .zh-pinyin {
            font-size: 18px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .zh-meaning {
            line-height: 1.9;
            margin-bottom: 14px;
        }

        .zh-words-title {
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 8px;
        }

        .zh-words {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .zh-word {
            background: var(--surface-peach);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-pill);
            padding: 4px 12px;
        }

        /* 历史记录栏 */
        .dict-history {
            position: sticky;
            top: 90px;
            background: var(--card-bg-color);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-soft);
            padding: 18px;
        }

        .dict-history-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 700;
            color: var(--primary);
        }

        .dict-history-head .clear-btn {
            background: none;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            border-radius: var(--radius-pill);
            padding: 2px 10px;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .dict-history-head .clear-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 62vh;
            overflow-y: auto;
        }

        .history-empty {
            color: var(--text-secondary);
            font-size: 14px;
            padding: 6px 2px;
        }

        .history-item {
            background: var(--surface-peach);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 8px 10px;
            cursor: pointer;
            transition: var(--transition);
        }

        .history-item:hover {
            border-color: var(--primary);
        }

        .h-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .h-tag {
            flex: none;
            font-size: 11px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: var(--radius-pill);
            color: #fff;
        }

        .h-tag.en {
            background: var(--primary);
        }

        .h-tag.zh {
            background: var(--secondary);
        }

        .h-q {
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .h-r {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.4;
            margin-top: 2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @media (max-width: 800px) {
            .dict-layout {
                grid-template-columns: 1fr;
            }

            .dict-history {
                position: static;
            }

            .zh-grid {
                grid-template-columns: 1fr;
            }

            .dict-search {
                flex-direction: column;
            }
        }
    </style>
</head>

<body data-assistant-mode="study">
    <div class="container">
        <div class="dict-layout">
            <!-- 左：主窗口 -->
            <div class="dict-main">
                <!-- 英文词典 -->
                <div class="page active" id="englishDictPage">
                    <div class="dict-card">
                        <h2 class="dict-title"><i class="fas fa-language"></i> 英文词典</h2>
                        <div class="dict-search">
                            <input id="enInput" class="form-control" type="text" autocomplete="off"
                                placeholder="输入英文或中文单词，如 apple / 苹果，回车查询">
                            <button id="enBtn" class="btn btn-primary" type="button">
                                <i class="fas fa-search"></i><span>查询</span>
                            </button>
                        </div>
                        <div id="enResult" class="dict-result">
                            <div class="dict-hint">输入英文单词可查看音标、发音、释义、例句和中文翻译；输入中文可查英文。</div>
                        </div>
                    </div>
                </div>

                <!-- 汉语词典 -->
                <div class="page" id="chineseDictPage">
                    <div class="dict-card">
                        <h2 class="dict-title"><i class="fas fa-book"></i> 汉语词典</h2>
                        <div class="dict-search">
                            <input id="zhInput" class="form-control" type="text" maxlength="1" autocomplete="off"
                                placeholder="输入一个汉字，如 好，回车查询">
                            <button id="zhBtn" class="btn btn-primary" type="button">
                                <i class="fas fa-search"></i><span>查询</span>
                            </button>
                        </div>
                        <div id="zhResult" class="dict-result">
                            <div class="dict-hint">输入一个汉字，可查看笔顺动画、字义和组词。</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右：历史查询记录 -->
            <aside class="dict-history">
                <div class="dict-history-head">
                    <span><i class="fas fa-clock-rotate-left"></i> 查询历史</span>
                    <button id="clearHistoryBtn" class="clear-btn" type="button">清空</button>
                </div>
                <div id="historyList" class="history-list"></div>
            </aside>
        </div>
    </div>

    <script>
        const NAV_CONFIG = [
            { page: 'englishDict', icon: 'fa-language', label: '英文词典', active: true },
            { page: 'chineseDict', icon: 'fa-book', label: '汉语词典', active: false },
        ];

        const HISTORY_KEY = 'dictHistory';
        const HISTORY_MAX = 30;

        let navLinks, pages;
        let charDict = [];
        let hanziWriter = null;
        let historyData = [];

        function init() {
            syncThemeFromIndex();
            navLinks = document.querySelectorAll('.nav-link');
            pages = document.querySelectorAll('.page');
            loadCharDict();
            loadLocalDict();
            loadHistory();
            renderHistory();
            setupEventListeners();
            initLearningAssistant();
        }

        function setupEventListeners() {
            setupNavLinks(navLinks, pages);
            setupHomeLink('homeLink', 'index.html');

            const enInput = document.getElementById('enInput');
            const enBtn = document.getElementById('enBtn');
            if (enBtn) enBtn.addEventListener('click', searchEnglish);
            if (enInput) enInput.addEventListener('keydown', e => { if (e.key === 'Enter') searchEnglish(); });

            const zhInput = document.getElementById('zhInput');
            const zhBtn = document.getElementById('zhBtn');
            if (zhBtn) zhBtn.addEventListener('click', searchChinese);
            if (zhInput) zhInput.addEventListener('keydown', e => { if (e.key === 'Enter') searchChinese(); });

            const clearBtn = document.getElementById('clearHistoryBtn');
            if (clearBtn) clearBtn.addEventListener('click', clearHistory);
        }

        function escHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        /* ===== 历史记录 ===== */
        function loadHistory() {
            try {
                historyData = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
                if (!Array.isArray(historyData)) historyData = [];
            } catch (e) { historyData = []; }
        }

        function saveHistory() {
            try { localStorage.setItem(HISTORY_KEY, JSON.stringify(historyData)); } catch (e) { }
        }

        function addHistory(type, query, result) {
            historyData = historyData.filter(h => !(h.type === type && h.query === query));
            historyData.unshift({ type, query, result: result || '', time: Date.now() });
            if (historyData.length > HISTORY_MAX) historyData = historyData.slice(0, HISTORY_MAX);
            saveHistory();
            renderHistory();
        }

        function clearHistory() {
            historyData = [];
            saveHistory();
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            if (!list) return;
            if (!historyData.length) {
                list.innerHTML = '<div class="history-empty">暂无查询记录</div>';
                return;
            }
            list.innerHTML = '';
            historyData.forEach(item => {
                const el = document.createElement('div');
                el.className = 'history-item';
                const tag = item.type === 'en' ? '<span class="h-tag en">英</span>' : '<span class="h-tag zh">汉</span>';
                el.innerHTML = '<div class="h-row">' + tag + '<span class="h-q">' + escHtml(item.query) + '</span></div>' +
                    (item.result ? '<div class="h-r">' + escHtml(item.result) + '</div>' : '');
                el.addEventListener('click', () => replayHistory(item));
                list.appendChild(el);
            });
        }

        function replayHistory(item) {
            if (item.type === 'en') {
                switchPageCommon('englishDict', navLinks, pages);
                document.getElementById('enInput').value = item.query;
                searchEnglish();
            } else {
                switchPageCommon('chineseDict', navLinks, pages);
                document.getElementById('zhInput').value = item.query;
                searchChinese();
            }
        }

        function fetchWithTimeout(url, ms) {
            const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
            const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, ms);
            return fetch(url, ctrl ? { signal: ctrl.signal } : undefined).finally(() => clearTimeout(timer));
        }

        // 词性缩写 -> 中文
        function posCn(p) {
            const map = { n: '名词', v: '动词', adj: '形容词', adv: '副词', u: '其他', interj: '感叹词', prep: '介词', conj: '连词', pron: '代词', det: '限定词', num: '数词', aux: '助动词', abbr: '缩写', prefix: '前缀', suffix: '后缀' };
            return map[p] || p || '';
        }

        // 发音按钮（有道发音直链，媒体播放无需 CORS）
        function renderPron(container, word) {
            const uk = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=1';
            const us = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=2';
            container.innerHTML = '<div class="en-sec-title">发音</div><div class="en-audios">' +
                '<button class="en-audio-btn" type="button" data-src="' + escHtml(uk) + '"><i class="fas fa-volume-up"></i> 英式</button>' +
                '<button class="en-audio-btn" type="button" data-src="' + escHtml(us) + '"><i class="fas fa-volume-up"></i> 美式</button>' +
                '</div>';
            container.querySelectorAll('.en-audio-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const src = btn.getAttribute('data-src');
                    if (!src) return;
                    try { new Audio(src).play(); } catch (e) { console.error('发音播放失败:', e); }
                });
            });
        }

        /* ===== 英文词典：先本地词库检索，未命中再联网 ===== */
        let localDict = null;
        let localDictPromise = null;

        function loadLocalDict() {
            if (localDict) return Promise.resolve(localDict);
            if (localDictPromise) return localDictPromise;
            localDictPromise = fetch('data/english/book-index.json')
                .then(r => r.ok ? r.json() : [])
                .then(list => Promise.all([
                    ...(Array.isArray(list) ? list : []).map(e =>
                        fetch(e.file).then(r => r.ok ? r.json() : []).catch(() => [])
                    ),
                    fetch('data/english/wordlists.json').then(r => r.ok ? r.json() : {}).catch(() => ({}))
                ]))
                .then(arrs => {
                    const map = new Map();
                    const add = item => {
                        if (item && item.word) {
                            const k = String(item.word).toLowerCase();
                            if (!map.has(k)) map.set(k, item);
                        }
                    };
                    arrs.forEach(arr => {
                        if (Array.isArray(arr)) { arr.forEach(add); }
                        else if (arr && typeof arr === 'object') {
                            Object.values(arr).forEach(v => { if (Array.isArray(v)) v.forEach(add); });
                        }
                    });
                    localDict = map;
                    return map;
                })
                .catch(() => { localDict = new Map(); return localDict; });
            return localDictPromise;
        }

        function searchEnglish() {
            const input = document.getElementById('enInput');
            const result = document.getElementById('enResult');
            const q = (input.value || '').trim();
            if (!q) { result.innerHTML = '<div class="dict-hint">请先输入要查询的单词。</div>'; return; }

            if (!/[\u4e00-\u9fff]/.test(q)) {
                // 英文：先本地词库
                result.innerHTML = '<div class="dict-hint"><i class="fas fa-spinner fa-spin"></i> 查询中...</div>';
                loadLocalDict().then(map => {
                    const entry = map.get(q.toLowerCase());
                    if (entry) { renderLocalEnglish(q, entry); }
                    else { onlineEnglishLookup(q); }
                });
            } else {
                // 中文：直接联网翻译
                onlineEnglishLookup(q);
            }
        }

        // 本地词库命中
        function renderLocalEnglish(q, entry) {
            const result = document.getElementById('enResult');
            result.innerHTML =
                '<div class="en-head"><span class="en-word">' + escHtml(q) + '</span>' +
                (entry.phonetic ? '<span class="en-ipa">' + escHtml(entry.phonetic) + '</span>' : '') + '</div>' +
                '<div id="enAudios"></div>' +
                (entry.meaning ? '<div class="en-trans">' + escHtml(entry.meaning) + '</div>' : '') +
                (entry.example ? '<div class="en-sec-title">例句</div><div class="en-defs"><div class="en-example">' + escHtml(entry.example) + '</div></div>' : '') +
                '<div class="dict-src-hint"><i class="fas fa-database"></i> 本地词库</div>';
            renderPron(document.getElementById('enAudios'), q);
            addHistory('en', q, entry.meaning || '');
        }

        // 联网查询（本地未命中时）
        function onlineEnglishLookup(q) {
            const result = document.getElementById('enResult');
            const isZh = /[\u4e00-\u9fff]/.test(q);
            const pair = isZh ? 'zh-CN|en' : 'en|zh-CN';

            // 骨架：各数据源独立渲染，互不阻塞
            result.innerHTML =
                '<div class="en-head"><span class="en-word">' + escHtml(q) + '</span><span class="en-ipa" id="enIpa"></span></div>' +
                '<div id="enAudios"></div>' +
                '<div class="en-trans" id="enTrans"><i class="fas fa-spinner fa-spin"></i> 翻译中...</div>' +
                '<div id="enAlts"></div>' +
                '<div id="enDefs"></div>' +
                '<div id="enExtra"></div>';

            const transEl = document.getElementById('enTrans');
            const altsEl = document.getElementById('enAlts');
            const defsEl = document.getElementById('enDefs');
            const extraEl = document.getElementById('enExtra');
            const ipaEl = document.getElementById('enIpa');
            const audiosEl = document.getElementById('enAudios');

            let histSaved = false;
            const saveHist = summary => { if (!histSaved) { histSaved = true; addHistory('en', q, summary || ''); } };

            // 1) 中文翻译
            fetchWithTimeout('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(q) + '&langpair=' + encodeURIComponent(pair), 10000)
                .then(r => r.json())
                .then(data => {
                    const t = data && data.responseData && data.responseData.translatedText;
                    if (!t) { transEl.innerHTML = '<span class="dict-empty">未找到翻译</span>'; return; }
                    transEl.textContent = t;
                    const seen = new Set([String(t).toLowerCase()]);
                    const alts = [];
                    (data.matches || []).forEach(m => {
                        const tr = m && m.translation;
                        if (tr && !seen.has(String(tr).toLowerCase())) { seen.add(String(tr).toLowerCase()); alts.push(tr); }
                    });
                    if (alts.length) {
                        altsEl.innerHTML = '<div class="en-sec-title">其他译法</div><div class="en-alt">' +
                            alts.slice(0, 8).map(x => '<span>' + escHtml(x) + '</span>').join('') + '</div>';
                    }
                    saveHist(t);
                })
                .catch(() => { transEl.innerHTML = '<span class="dict-error">翻译查询失败（网络）</span>'; });

            if (isZh) return;

            // 2) 发音
            renderPron(audiosEl, q);

            // 3) 音标 / 释义 / 词性（datamuse）
            fetchWithTimeout('https://api.datamuse.com/words?sp=' + encodeURIComponent(q) + '&md=prd&ipa=1&max=1', 8000)
                .then(r => r.json())
                .then(list => {
                    const e = Array.isArray(list) ? list[0] : null;
                    if (!e) return;
                    const ipaTag = (e.tags || []).find(t => t.indexOf('ipa_pron:') === 0);
                    const ipa = ipaTag ? ipaTag.slice('ipa_pron:'.length) : '';
                    if (ipa) ipaEl.textContent = '/' + ipa + '/';
                    const defs = e.defs || [];
                    if (defs.length) {
                        let h = '<div class="en-sec-title">释义</div><div class="en-defs">';
                        defs.slice(0, 2).forEach(line => {
                            const i = line.indexOf('\t');
                            const pos = i >= 0 ? line.slice(0, i) : '';
                            const txt = (i >= 0 ? line.slice(i + 1) : line).trim();
                            h += '<div class="en-def"><div class="en-def-line">' +
                                (pos ? '<span class="pos-tag">' + escHtml(posCn(pos)) + '</span> ' : '') +
                                escHtml(txt) + '</div></div>';
                        });
                        h += '</div>';
                        defsEl.innerHTML = h;
                    }
                    saveHist(ipa || q);
                })
                .catch(() => {});

            // 4) 例句 / 同义词（dictionaryapi.dev，可达时补）
            fetchWithTimeout('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(q), 8000)
                .then(r => r.ok ? r.json() : null)
                .then(data => {
                    const entry = Array.isArray(data) ? data[0] : null;
                    if (!entry) return;
                    const examples = [];
                    (entry.meanings || []).forEach(m => (m.definitions || []).forEach(d => { if (d.example) examples.push(d.example); }));
                    const syns = new Set();
                    (entry.meanings || []).forEach(m => {
                        (m.synonyms || []).forEach(s => syns.add(s));
                        (m.definitions || []).forEach(d => (d.synonyms || []).forEach(s => syns.add(s)));
                    });
                    let h = '';
                    if (examples.length) {
                        h += '<div class="en-sec-title">例句</div><div class="en-defs">' +
                            examples.slice(0, 5).map(x => '<div class="en-example">' + escHtml(x) + '</div>').join('') + '</div>';
                    }
                    if (syns.size) {
                        h += '<div class="en-sec-title">同义词</div><div class="en-alt">' +
                            [...syns].slice(0, 12).map(x => '<span>' + escHtml(x) + '</span>').join('') + '</div>';
                    }
                    if (h) extraEl.innerHTML = h;
                })
                .catch(() => {});
        }

        /* ===== 汉语词典：本地字义/组词 + hanzi-writer 在线笔顺 ===== */
        function loadCharDict() {
            fetch('data/chinese/char-dict.json')
                .then(r => { if (!r.ok) throw new Error('字典数据加载失败'); return r.json(); })
                .then(data => { charDict = Array.isArray(data.characters) ? data.characters : []; })
                .catch(err => { console.error('加载汉字数据失败:', err); charDict = []; });
        }

        function searchChinese() {
            const input = document.getElementById('zhInput');
            const result = document.getElementById('zhResult');
            const raw = (input.value || '').trim();
            const char = Array.from(raw)[0];
            if (!char) { result.innerHTML = '<div class="dict-hint">请先输入一个汉字。</div>'; return; }

            const isCJK = /[\u4e00-\u9fff]/.test(char);
            const entry = charDict.find(c => c.char === char);

            let infoHtml = '<div class="zh-char">' + escHtml(char) + '</div>';
            let summary = '未收录';
            if (entry) {
                infoHtml += '<div class="zh-pinyin">拼音：' + escHtml(entry.pinyin) + '</div>';
                infoHtml += '<div class="zh-meaning">' + escHtml(entry.meaning) + '</div>';
                infoHtml += '<div class="zh-words-title">组词</div><div class="zh-words">' +
                    (entry.words || []).map(w => '<span class="zh-word">' + escHtml(w) + '</span>').join('') + '</div>';
                summary = entry.pinyin + ' ' + entry.meaning;
            } else {
                infoHtml += '<div class="dict-empty">暂未收录该字的释义与组词' + (isCJK ? '（笔顺仍可查看）' : '') + '。</div>';
            }

            const strokeHtml = isCJK
                ? '<div class="zh-stroke"><div id="hanziTarget"></div>' +
                  '<div class="zh-stroke-btns">' +
                  '<button id="hanziPlay" class="btn btn-secondary" type="button"><i class="fas fa-play"></i> 笔顺</button>' +
                  '<button id="hanziOutline" class="btn btn-secondary" type="button"><i class="fas fa-pencil"></i> 循环</button>' +
                  '</div></div>'
                : '<div class="zh-stroke"><div class="dict-hint">请输入汉字以查看笔顺。</div></div>';

            result.innerHTML = '<div class="zh-grid">' + strokeHtml + '<div class="zh-info">' + infoHtml + '</div></div>';

            if (isCJK && typeof HanziWriter !== 'undefined') {
                try {
                    hanziWriter = HanziWriter.create('hanziTarget', char, {
                        width: 200, height: 200, padding: 8, showOutline: true,
                        strokeAnimationSpeed: 1, delayBetweenStrokes: 250
                    });
                    hanziWriter.animateCharacter();
                    const playBtn = document.getElementById('hanziPlay');
                    const outlineBtn = document.getElementById('hanziOutline');
                    if (playBtn) playBtn.addEventListener('click', () => hanziWriter.animateCharacter());
                    if (outlineBtn) outlineBtn.addEventListener('click', () => hanziWriter.loopCharacterAnimation());
                } catch (e) {
                    console.error('笔顺渲染失败:', e);
                }
            }

            addHistory('zh', char, summary);
        }

        // 初始化应用
        (function () {
            injectNav(NAV_CONFIG);
            injectFooter();
            injectAssistant();
            init();
        })();
    </script>

</body>
