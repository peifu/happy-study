
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快乐学习 - 学习助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/learning-assistant.css">
    <style>
        :root {
            --assistant-primary: var(--primary);
            --assistant-secondary: var(--secondary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Page switching */
        .page { display: none; flex-direction: column; }
        .page.active { display: flex; }

        /* Shared section title */
        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--assistant-primary), var(--assistant-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .settings-card {
            background: var(--card-bg-color);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-card);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .settings-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .settings-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .settings-header .settings-icon {
            font-size: 24px;
            color: var(--assistant-primary);
        }

        .settings-header .settings-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 0;
            background: none;
            -webkit-text-fill-color: var(--text-color);
            background-clip: unset;
        }

        .form-group { margin-bottom: 20px; }
        .form-group:last-child { margin-bottom: 0; }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--text-color);
        }

        /* Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 26px;
            flex-shrink: 0;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-round {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #ccc;
            transition: 0.3s; border-radius: 26px;
        }
        .slider-round::before {
            content: ""; position: absolute;
            height: 20px; width: 20px;
            left: 3px; bottom: 3px;
            background: white; transition: 0.3s; border-radius: 50%;
        }
        .switch input:checked + .slider-round {
            background: linear-gradient(90deg, var(--assistant-primary), var(--assistant-secondary));
        }
        .switch input:checked + .slider-round::before {
            transform: translateX(22px);
        }

        /* Range slider */
        .range-slider {
            -webkit-appearance: none;
            width: 100%; height: 6px; border-radius: 3px;
            background: rgba(255, 255, 255, 0.12); outline: none;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px; height: 20px; border-radius: 50%;
            background: linear-gradient(135deg, var(--assistant-primary), var(--assistant-secondary));
            cursor: pointer; box-shadow: 0 2px 8px rgba(124, 77, 255, 0.4);
        }
        .range-slider::-moz-range-thumb {
            width: 20px; height: 20px; border-radius: 50%;
            background: linear-gradient(135deg, var(--assistant-primary), var(--assistant-secondary));
            cursor: pointer; border: none;
            box-shadow: 0 2px 8px rgba(124, 77, 255, 0.4);
        }
        .slider-value {
            text-align: center; font-size: 14px; font-weight: 600;
            color: var(--assistant-primary); margin-top: 5px;
        }

        /* Animal selection */
        .animal-selection {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }
        .animal-option {
            display: flex; flex-direction: column; align-items: center;
            gap: 6px; padding: 10px 6px; border-radius: 12px;
            cursor: pointer; transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
        }
        .animal-option:hover {
            background: rgba(124, 77, 255, 0.1);
            transform: translateY(-2px);
        }
        .animal-option.selected {
            background: rgba(124, 77, 255, 0.15);
            border-color: var(--assistant-primary);
            box-shadow: 0 0 15px rgba(124, 77, 255, 0.2);
        }
        .animal-icon {
            width: 50px; height: 50px; border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .animal-option span {
            font-size: 11px; color: var(--text-secondary);
            text-align: center; line-height: 1.2;
        }
        .animal-option.selected span {
            color: var(--assistant-primary); font-weight: 600;
        }

        /* Form input */
        .form-control {
            width: 100%; padding: 10px 14px; border-radius: 10px;
            border: 1px solid var(--border-card);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-color); font-size: 14px; outline: none;
        }
        .form-control:focus {
            border-color: var(--assistant-primary);
            box-shadow: 0 0 0 3px rgba(124, 77, 255, 0.15);
        }

        /* ===== 学习记录页样式 ===== */
        .records-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        .record-card {
            background: var(--card-bg-color);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-card);
            transition: transform 0.3s ease;
        }
        .record-card:hover { transform: translateY(-2px); }
        .record-card { cursor: pointer; position: relative; }
        .record-card.expanded { grid-column: 1 / -1; }

        /* 记录详情面板 */
        .record-detail {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-subtle);
        }
        .record-card.expanded .record-detail { display: block; }
        .record-detail-section {
            margin-bottom: 12px;
        }
        .record-detail-section:last-child { margin-bottom: 0; }
        .record-detail-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-color);
        }
        .record-detail-header .rd-dot {
            width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
        }
        .record-detail-header .rd-count {
            font-size: 12px; color: var(--text-secondary); font-weight: 400;
        }
        .record-detail-items {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
        }
        .record-detail-items::-webkit-scrollbar { width: 4px; }
        .record-detail-items::-webkit-scrollbar-thumb { background: var(--border-card); border-radius: 2px; }
        .rd-item-tag {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            white-space: nowrap;
        }
        .rd-item-tag.mastered { background: rgba(52, 168, 83, 0.15); color: #34a853; }
        .rd-item-tag.unmastered { background: rgba(234, 67, 53, 0.12); color: #ea4335; }
        .rd-item-tag.unlearned { background: rgba(255,255,255,0.06); color: var(--text-secondary); }
        .record-card .card-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .record-card .subject-icon-bg {
            width: 48px; height: 48px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: #fff; flex-shrink: 0;
        }
        .record-card .subject-name {
            font-size: 16px; font-weight: 600; color: var(--text-color);
        }
        .record-card .record-stats {
            display: flex; justify-content: space-between;
            margin-bottom: 12px;
        }
        .record-card .record-stat {
            text-align: center;
        }
        .record-card .record-stat-value {
            font-size: 22px; font-weight: 700;
        }
        .record-card .record-stat-label {
            font-size: 11px; color: var(--text-secondary);
        }
        .record-bar-container {
            width: 100%; height: 8px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px; overflow: hidden;
        }
        .record-bar-fill {
            height: 100%; border-radius: 4px;
            transition: width 0.6s ease;
        }

        /* ===== 积分奖励页样式 ===== */

        /* 积分宝库 */
        .points-vault {
            position: relative;
            background: var(--card-bg-color);
            border-radius: 24px;
            padding: 36px 28px 28px;
            border: 1px solid var(--border-card);
            margin-top: 15px;
            margin-bottom: 28px;
            overflow: hidden;
        }
        .vault-glow {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 120px;
            background: radial-gradient(ellipse, rgba(255,215,0,0.12) 0%, transparent 70%);
            pointer-events: none;
        }
        .vault-main {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 36px;
            flex-wrap: wrap;
        }
        .vault-total-wrap {
            text-align: center;
            min-width: 140px;
        }
        .vault-icon {
            font-size: 36px;
            margin-bottom: 4px;
            animation: vaultPulse 2s ease-in-out infinite;
        }
        @keyframes vaultPulse {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.08); filter: brightness(1.3); }
        }
        .points-total {
            font-size: 52px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700 0%, #ffb800 40%, #ff8c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            letter-spacing: -1px;
        }
        .points-total-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 2px;
            letter-spacing: 2px;
        }
        .vault-divider {
            width: 1px;
            height: 80px;
            background: linear-gradient(180deg, transparent, rgba(255,215,0,0.2), transparent);
        }
        .vault-stats {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .vault-stat {
            text-align: center;
            min-width: 80px;
        }
        .vault-stat-icon { font-size: 24px; margin-bottom: 4px; }
        .vault-stat-num {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
        }
        .vault-stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        .vault-stat-sub {
            font-size: 10px;
            color: var(--text-secondary);
            opacity: 0.6;
            margin-top: 1px;
        }

        /* 学者等级 */
        .rank-section {
            margin-bottom: 24px;
        }
        .rank-display {
            background: var(--card-bg-color);
            border-radius: 20px;
            padding: 28px;
            border: 1px solid var(--border-card);
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            position: relative;
            overflow: hidden;
        }
        .rank-display::before {
            content: '';
            position: absolute;
            top: -40px;
            right: -40px;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,215,0,0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .rank-medal {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            background: rgba(255,255,255,0.04);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        .rank-info {
            flex: 1;
            min-width: 140px;
            position: relative;
            z-index: 1;
        }
        .rank-name {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }
        .rank-sub {
            font-size: 28px;
            font-weight: 300;
            color: var(--text-secondary);
            letter-spacing: 4px;
            margin-top: 2px;
        }
        .rank-progress-wrap {
            min-width: 200px;
            flex: 1;
            position: relative;
            z-index: 1;
        }
        .rank-progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .rank-progress-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #ffd700, #ff8c00, #ff4081);
            transition: width 0.8s ease;
        }
        .rank-progress-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
            text-align: right;
        }

        /* 等级天梯 */
        .rank-ladder {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
        }
        .rank-rung {
            background: var(--card-bg-color);
            border-radius: 12px;
            padding: 12px 10px;
            border: 1px solid var(--border-card);
            text-align: center;
            transition: all 0.3s ease;
            opacity: 0.35;
        }
        .rank-rung.reached {
            opacity: 1;
        }
        .rank-rung.current {
            opacity: 1;
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.2);
            transform: scale(1.03);
        }
        .rank-rung .rr-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }
        .rank-rung .rr-name {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-color);
        }
        .rank-rung .rr-sub {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 1px;
        }
        .rank-rung .rr-pts {
            font-size: 9px;
            color: var(--text-secondary);
            opacity: 0.6;
            margin-top: 2px;
        }
        .rank-rung.current .rr-name { color: #ffd700; }
        .rank-rung.current .rr-icon { animation: rankPulse 1.5s ease-in-out infinite; }
        @keyframes rankPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* 徽章分区 */
        .badge-section {
            margin-bottom: 24px;
        }
        .badge-section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .bsh-icon { font-size: 22px; }
        .bsh-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-color);
        }
        .bsh-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-left: auto;
        }

        /* 徽章网格 */
        .badges-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }
        .badge-card {
            background: var(--card-bg-color);
            border-radius: 16px;
            padding: 20px 12px 16px;
            border: 1px solid var(--border-card);
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .badge-card:hover { transform: translateY(-3px); }
        .badge-card.unlocked {
            border-color: rgba(255,215,0,0.25);
        }
        .badge-card.max-level {
            border-color: rgba(255,215,0,0.45);
            box-shadow: 0 0 28px rgba(255,215,0,0.1), inset 0 0 40px rgba(255,215,0,0.02);
        }
        .badge-card.max-level::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(255,215,0,0.05), transparent 60%);
            pointer-events: none;
        }
        .badge-icon-wrap {
            width: 50px; height: 50px;
            border-radius: 50%;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            background: rgba(255,255,255,0.04);
            transition: all 0.3s ease;
        }
        .badge-card.unlocked .badge-icon-wrap {
            background: rgba(255,215,0,0.06);
        }
        .badge-card.max-level .badge-icon-wrap {
            background: rgba(255,215,0,0.12);
            box-shadow: 0 0 16px rgba(255,215,0,0.15);
        }
        .badge-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 8px;
        }
        .badge-levels {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 8px;
        }
        .badge-level-star {
            width: 16px; height: 16px;
            border-radius: 50%;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.06);
            color: var(--text-secondary);
        }
        .badge-level-star.earned {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #fff;
            box-shadow: 0 0 6px rgba(255,215,0,0.35);
        }
        .badge-progress {
            width: 100%; height: 3px;
            background: rgba(255,255,255,0.05);
            border-radius: 2px;
            overflow: hidden;
        }
        .badge-progress-fill {
            height: 100%;
            border-radius: 2px;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            transition: width 0.6s ease;
        }
        .badge-progress-text {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .badge-card.max-level .badge-progress-fill {
            background: linear-gradient(90deg, #ffd700, #ff6b6b, #a78bfa);
            animation: badgeMaxShine 2s ease-in-out infinite;
        }
        @keyframes badgeMaxShine {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 各科目积分 */
        .points-subjects-section {
            margin-bottom: 24px;
        }
        .points-subjects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .points-subject-card {
            background: var(--card-bg-color);
            border-radius: 14px;
            padding: 16px 18px;
            border: 1px solid var(--border-card);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.2s;
        }
        .points-subject-card:hover { transform: translateY(-1px); }
        .points-subject-card .ps-icon {
            width: 40px; height: 40px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: #fff; flex-shrink: 0;
        }
        .points-subject-card .ps-info { flex: 1; }
        .points-subject-card .ps-name { font-size: 12px; color: var(--text-secondary); }
        .points-subject-card .ps-points { font-size: 18px; font-weight: 700; color: #ffd700; }

        .points-history {
            background: var(--card-bg-color);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-card);
        }
        .points-history-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .points-history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 13px;
        }
        .points-history-item:last-child { border-bottom: none; }
        .ph-reason { color: var(--text-color); flex: 1; }
        .ph-time { color: var(--text-secondary); font-size: 11px; margin: 0 12px; white-space: nowrap; }
        .ph-points { font-weight: 700; color: #ffd700; white-space: nowrap; }
        .points-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .points-empty i { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }


        @media (max-width: 768px) {
            .settings-grid, .records-grid { grid-template-columns: 1fr; }
            .points-subjects { grid-template-columns: 1fr 1fr; }
            .badges-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
            .page-title { font-size: 22px; }
            .animal-selection { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; }
            .animal-icon { width: 40px; height: 40px; }
            .points-total { font-size: 40px; }
            .vault-main { gap: 20px; }
            .vault-stats { gap: 16px; }
            .vault-divider { height: 1px; width: 80%; }
            .rank-display { flex-direction: column; text-align: center; gap: 16px; }
            .rank-progress-wrap { min-width: 0; width: 100%; }
            .rank-ladder { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            .rank-medal { width: 56px; height: 56px; font-size: 32px; }
            .rank-name { font-size: 20px; }
            .bsh-desc { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- ========== 助手设置页面 ========== -->
        <div class="page active" id="assistantPage">
            <h2 class="page-title">助手设置</h2>

            <div class="settings-grid">
                <!-- 卡片1：助手设置 -->
                <div class="settings-card">
                    <div class="settings-header">

    <script src="assets/js/common.js"></script>
    <script src="assets/js/learning-assistant.js"></script>
    <script>
        // 页面配置
        (function() {
            var NAV_CONFIG = [
                { page: 'home',      icon: 'fa-home',     label: '学习主页', active: false },
                { page: 'assistant', icon: 'fa-robot',    label: '助手设置', active: true },
                { page: 'records',   icon: 'fa-chart-bar', label: '学习记录', active: false },
                { page: 'points',    icon: 'fa-star',     label: '积分奖励', active: false },
            ];
            injectNav(NAV_CONFIG);
            injectFooter();
            injectAssistant();

            // 修复 DOM 引用
            if (window.learningAssistant) {
                window.learningAssistant.assistant = document.getElementById('learningAssistant');
                window.learningAssistant.speechBubble = document.getElementById('assistantSpeechBubble');
                window.learningAssistant.assistantName = document.getElementById('assistantName');
            }

            // 导航事件
            var navLinks = document.querySelectorAll('.nav-link');
            var pages = document.querySelectorAll('.page');
            if (typeof setupNavLinks === 'function') {
                setupNavLinks(navLinks, pages, function(pageId) {
                    if (pageId === 'home') window.location.href = 'index.html';
                    if (pageId === 'records') renderRecords();
                    if (pageId === 'points') renderPoints();
                });
            }

            if (typeof setupHomeLink === 'function') {
                setupHomeLink('homeLink', 'index.html');
            }
            if (typeof syncThemeFromIndex === 'function') {
                syncThemeFromIndex();
            }

            // 积分更新时自动刷新积分页面
            window.addEventListener('studyPointsUpdated', function() {
                var pointsPage = document.getElementById('pointsPage');
                if (pointsPage && pointsPage.classList.contains('active')) {
                    renderPoints();
                }
            });

            // ===== 学习记录渲染 =====
            function renderRecords() {
                var subjects = [
                    {
                        id: 'english', name: '英语', icon: 'fa-language', color: '#4285f4',
                        getData: function() {
                            var map = JSON.parse(localStorage.getItem('masteredWordsMap') || '{}');
                            var mastered = [], unmastered = [];
                            for (var book in map) {
                                for (var word in map[book]) {
                                    if (map[book][word]) mastered.push(word);
                                    else unmastered.push(word);
                                }
                            }
                            var total = mastered.length + unmastered.length;
                            if (total === 0) total = 1258;
                            return { mastered: mastered, unmastered: unmastered, total: total };
                        }
                    },
                    {
                        id: 'chinese', name: '语文', icon: 'fa-pen-fancy', color: '#ea4335',
                        getData: function() {
                            var map = JSON.parse(localStorage.getItem('masteredPoems') || '{}');
                            var mastered = [], unmastered = [];
                            for (var title in map) {
                                if (map[title]) mastered.push(title);
                                else unmastered.push(title);
                            }
                            var total = mastered.length + unmastered.length;
                            if (total === 0) total = 64;
                            return { mastered: mastered, unmastered: unmastered, total: total };
                        }
                    },
                    {
                        id: 'math', name: '数学', icon: 'fa-calculator', color: '#fbbc05',
                        getData: function() {
                            var map = JSON.parse(localStorage.getItem('masteredConcepts') || '{}');
                            var mastered = [], unmastered = [];
                            for (var t in map) {
                                if (map[t]) mastered.push(t);
                                else unmastered.push(t);
                            }
                            var total = mastered.length + unmastered.length;
                            if (total === 0) total = 128;
                            return { mastered: mastered, unmastered: unmastered, total: total };
                        }
                    },
                    {
                        id: 'pe', name: '体育', icon: 'fa-running', color: '#34a853',
                        getData: function() {
                            var map = JSON.parse(localStorage.getItem('masteredSports') || '{}');
                            var mastered = [], unmastered = [];
                            for (var t in map) {
                                if (map[t]) mastered.push(t);
                                else unmastered.push(t);
                            }
                            var total = mastered.length + unmastered.length;
                            if (total === 0) total = 36;
                            return { mastered: mastered, unmastered: unmastered, total: total };
                        }
                    },
                    {
                        id: 'science', name: '科学', icon: 'fa-flask', color: '#9b59b6',
                        getData: function() {
                            var map = JSON.parse(localStorage.getItem('baikeMasteredConcepts') || '{}');
                            var mastered = [], unmastered = [];
                            for (var topic in map) {
                                for (var c in map[topic]) {
                                    if (map[topic][c]) mastered.push(c);
                                    else unmastered.push(c);
                                }
                            }
                            var total = mastered.length + unmastered.length;
                            if (total === 0) total = 42;
                            return { mastered: mastered, unmastered: unmastered, total: total };
                        }
                    }
                ];

                var grid = document.getElementById('recordsGrid');
                var html = '';
                subjects.forEach(function(s) {
                    var data = s.getData();
                    var masteredCount = data.mastered.length;
                    var unmasteredCount = data.unmastered.length;
                    var knownTotal = masteredCount + unmasteredCount;
                    var unlearnedCount = Math.max(0, data.total - knownTotal);
                    var pct = data.total > 0 ? Math.round(masteredCount / data.total * 100) : 0;
                    html += '<div class="record-card" data-subject="' + s.id + '">' +
                        '<div class="card-top">' +
                            '<div class="subject-icon-bg" style="background:' + s.color + '">' +
                                '<i class="fas ' + s.icon + '"></i>' +
                            '</div>' +
                            '<div class="subject-name">' + s.name + '</div>' +
                        '</div>' +
                        '<div class="record-stats">' +
                            '<div class="record-stat"><div class="record-stat-value" style="color:#34a853">' + masteredCount + '</div><div class="record-stat-label">已掌握</div></div>' +
                            '<div class="record-stat"><div class="record-stat-value" style="color:#ea4335">' + unmasteredCount + '</div><div class="record-stat-label">未掌握</div></div>' +
                            '<div class="record-stat"><div class="record-stat-value" style="color:' + s.color + '">' + pct + '%</div><div class="record-stat-label">进度</div></div>' +
                        '</div>' +
                        '<div class="record-bar-container"><div class="record-bar-fill" style="width:' + pct + '%;background:' + s.color + '"></div></div>' +
                        '<div class="record-detail">' +
                            buildDetailSection('已掌握', '#34a853', data.mastered, 'mastered') +
                            buildDetailSection('未掌握', '#ea4335', data.unmastered, 'unmastered') +
                            '<div class="record-detail-section">' +
                                '<div class="record-detail-header"><div class="rd-dot" style="background:rgba(255,255,255,0.15)"></div>未学习<span class="rd-count">~' + unlearnedCount + ' 项</span></div>' +
                            '</div>' +
                        '</div>' +
                    '</div>';
                });
                grid.innerHTML = html || '<div class="points-empty"><i class="fas fa-book-open"></i><p>暂无学习记录</p></div>';

                // 点击卡片展开详情
                grid.querySelectorAll('.record-card').forEach(function(card) {
                    card.addEventListener('click', function(e) {
                        var wasExpanded = card.classList.contains('expanded');
                        // 关闭所有展开
                        grid.querySelectorAll('.record-card.expanded').forEach(function(c) { c.classList.remove('expanded'); });
                        if (!wasExpanded) {
                            card.classList.add('expanded');
                        }
                    });
                });
            }

            function buildDetailSection(label, color, items, cls) {
                var shown = items.slice(0, 30);
                var more = items.length > 30 ? ' +' + (items.length - 30) + ' 更多' : '';
                var tags = '';
                shown.forEach(function(name) {
                    tags += '<span class="rd-item-tag ' + cls + '">' + name + '</span>';
                });
                return '<div class="record-detail-section">' +
                    '<div class="record-detail-header"><div class="rd-dot" style="background:' + color + '"></div>' + label + '<span class="rd-count">' + items.length + ' 项</span></div>' +
                    '<div class="record-detail-items">' + tags + more + '</div>' +
                '</div>';
            }

            // ===== 积分奖励渲染 =====
            function renderPoints() {
                var data = typeof getStudyPoints === 'function' ? getStudyPoints() : { total: 0, subjects: {}, history: [] };
                if (!data.subjects) data.subjects = {};
                if (!data.history) data.history = [];

                document.getElementById('pointsTotal').textContent = data.total.toLocaleString();

                // 计算各科掌握数
                var engMap = JSON.parse(localStorage.getItem('masteredWordsMap') || '{}');
                var engMastered = 0;
                for (var bk in engMap) for (var w in engMap[bk]) { if (engMap[bk][w]) engMastered++; }

                var poemMap = JSON.parse(localStorage.getItem('masteredPoems') || '{}');
                var poemMastered = 0;
                for (var t in poemMap) { if (poemMap[t]) poemMastered++; }

                var mathMap = JSON.parse(localStorage.getItem('masteredConcepts') || '{}');
                var mathMastered = 0;
                for (var t in mathMap) { if (mathMap[t]) mathMastered++; }

                var subjWithPoints = 0;
                for (var k in data.subjects) { if (data.subjects[k].points > 0) subjWithPoints++; }

                // 学者等级定义：[{ name, icon, color, levels: [L1, L2, L3] }]
                var RANKS = [
                    { name: '青铜学者', icon: '🥉', color: '#cd7f32', levels: [50, 150, 300] },
                    { name: '白银学者', icon: '🥈', color: '#c0c0c0', levels: [500, 800, 1200] },
                    { name: '黄金学者', icon: '🥇', color: '#ffd700', levels: [1800, 2500, 3500] },
                    { name: '铂金学者', icon: '💠', color: '#a8e6cf', levels: [5000, 7000, 10000] },
                    { name: '钻石学者', icon: '💎', color: '#74b9ff', levels: [14000, 19000, 25000] },
                    { name: '智慧达人', icon: '🌟', color: '#a78bfa', levels: [32000, 40000, 50000] },
                    { name: '学海大师', icon: '📖', color: '#ff6b6b', levels: [62000, 76000, 92000] },
                    { name: '学习超神', icon: '👑', color: '#ff4081', levels: [110000, 140000, 180000] }
                ];

                // 计算当前等级
                var totalPoints = data.total;
                var currentRankIdx = 0;
                var currentSubIdx = 0;
                var nextThreshold = RANKS[0].levels[0];
                var prevThreshold = 0;
                var found = false;

                for (var ri = 0; ri < RANKS.length && !found; ri++) {
                    for (var si = 0; si < 3 && !found; si++) {
                        if (totalPoints < RANKS[ri].levels[si]) {
                            currentRankIdx = ri;
                            currentSubIdx = si;
                            nextThreshold = RANKS[ri].levels[si];
                            prevThreshold = (si === 0) ? (ri === 0 ? 0 : RANKS[ri - 1].levels[2]) : RANKS[ri].levels[si - 1];
                            found = true;
                        }
                    }
                }
                if (!found) {
                    // 已达最高等级
                    currentRankIdx = RANKS.length - 1;
                    currentSubIdx = 2;
                    prevThreshold = RANKS[currentRankIdx].levels[2];
                    nextThreshold = prevThreshold;
                }

                var rank = RANKS[currentRankIdx];
                var subLabels = ['I', 'II', 'III'];
                var progressPct = nextThreshold > prevThreshold ? Math.round((totalPoints - prevThreshold) / (nextThreshold - prevThreshold) * 100) : 100;
                progressPct = Math.max(0, Math.min(100, progressPct));

                // 更新等级展示
                document.getElementById('rankMedal').textContent = rank.icon;
                document.getElementById('rankName').textContent = rank.name;
                document.getElementById('rankName').style.color = rank.color;
                document.getElementById('rankSub').textContent = subLabels[currentSubIdx];
                document.getElementById('rankProgressFill').style.width = progressPct + '%';
                document.getElementById('rankProgressLabel').textContent = totalPoints.toLocaleString() + ' / ' + nextThreshold.toLocaleString();

                // 渲染等级天梯
                var ladderHtml = '';
                for (var ri = 0; ri < RANKS.length; ri++) {
                    var r = RANKS[ri];
                    for (var si = 0; si < 3; si++) {
                        var threshold = r.levels[si];
                        var reached = totalPoints >= threshold;
                        var isCurrent = (ri === currentRankIdx && si === currentSubIdx);
                        var rungClass = 'rank-rung';
                        if (isCurrent) rungClass += ' current';
                        else if (reached) rungClass += ' reached';
                        ladderHtml += '<div class="' + rungClass + '">' +
                            '<div class="rr-icon">' + r.icon + '</div>' +
                            '<div class="rr-name">' + r.name + '</div>' +
                            '<div class="rr-sub">' + subLabels[si] + '</div>' +
                            '<div class="rr-pts">' + threshold.toLocaleString() + ' 分</div>' +
                        '</div>';
                    }
                }
                document.getElementById('rankLadder').innerHTML = ladderHtml;

                // 学科技能（单科精通类）
                var subjectBadges = [
                    {
                        name: '单词大王', icon: '📚', subject: 'english',
                        getLevel: function(t, e) {
                            if (e >= 500) return 3;
                            if (e >= 200) return 2;
                            if (e >= 50) return 1;
                            return 0;
                        },
                        getProgress: function(t, e) {
                            if (e >= 500) return 100;
                            if (e >= 200) return Math.round((e - 200) / 3);
                            if (e >= 50) return Math.round((e - 50) / 1.5);
                            return Math.round(e / 0.5);
                        },
                        progressLabel: function(t, e) {
                            var thresholds = [50, 200, 500];
                            for (var i = 0; i < 3; i++) { if (e < thresholds[i]) return e + '/' + thresholds[i] + ' 词'; }
                            return 'MAX';
                        }
                    },
                    {
                        name: '诗词达人', icon: '📜', subject: 'chinese',
                        getLevel: function(t, e, p) {
                            if (p >= 50) return 3;
                            if (p >= 20) return 2;
                            if (p >= 5) return 1;
                            return 0;
                        },
                        getProgress: function(t, e, p) {
                            if (p >= 50) return 100;
                            if (p >= 20) return Math.round((p - 20) / 0.3);
                            if (p >= 5) return Math.round((p - 5) / 0.15);
                            return Math.round(p / 0.05);
                        },
                        progressLabel: function(t, e, p) {
                            var thresholds = [5, 20, 50];
                            for (var i = 0; i < 3; i++) { if (p < thresholds[i]) return p + '/' + thresholds[i] + ' 首'; }
                            return 'MAX';
                        }
                    },
                    {
                        name: '数学高手', icon: '🔢', subject: 'math',
                        getLevel: function(t, e, p, mt) {
                            if (mt >= 100) return 3;
                            if (mt >= 50) return 2;
                            if (mt >= 15) return 1;
                            return 0;
                        },
                        getProgress: function(t, e, p, mt) {
                            if (mt >= 100) return 100;
                            if (mt >= 50) return Math.round((mt - 50) / 0.5);
                            if (mt >= 15) return Math.round((mt - 15) / 0.35);
                            return Math.round(mt / 0.15);
                        },
                        progressLabel: function(t, e, p, mt) {
                            var thresholds = [15, 50, 100];
                            for (var i = 0; i < 3; i++) { if (mt < thresholds[i]) return mt + '/' + thresholds[i] + ' 题'; }
                            return 'MAX';
                        }
                    }
                ];

                function renderBadgeGrid(containerId, badges, total, eng, poem, math, sc) {
                    var html = '';
                    badges.forEach(function(b) {
                        var level = b.getLevel(total, eng, poem, math, sc);
                        var progress = b.getProgress(total, eng, poem, math, sc);
                        var progLabel = b.progressLabel(total, eng, poem, math, sc);
                        var isMax = level >= 3;

                        var cardClass = 'badge-card';
                        if (isMax) cardClass += ' max-level';
                        else if (level > 0) cardClass += ' unlocked';

                        var starsHtml = '';
                        for (var s = 1; s <= 3; s++) {
                            var starClass = 'badge-level-star';
                            if (s <= level) starClass += ' earned';
                            starsHtml += '<div class="' + starClass + '">' + (s <= level ? '★' : '☆') + '</div>';
                        }

                        html += '<div class="' + cardClass + '">' +
                            '<div class="badge-icon-wrap">' + b.icon + '</div>' +
                            '<div class="badge-name">' + b.name + '</div>' +
                            '<div class="badge-levels">' + starsHtml + '</div>' +
                            '<div class="badge-progress"><div class="badge-progress-fill" style="width:' + progress + '%"></div></div>' +
                            '<div class="badge-progress-text">' + progLabel + '</div>' +
                        '</div>';
                    });
                    document.getElementById(containerId).innerHTML = html;
                    return badges.reduce(function(sum, b) { return sum + b.getLevel(total, eng, poem, math, sc); }, 0);
                }

                var totalSubject = renderBadgeGrid('subjectBadges', subjectBadges, data.total, engMastered, poemMastered, mathMastered, subjWithPoints);

                // 总徽章数 = 学科徽章等级 + 当前学者等级(按1-24级算)
                var rankLevel = currentRankIdx * 3 + currentSubIdx + 1;
                var totalBadgeLevels = totalSubject + rankLevel;

                // 宝库统计
                var streak = typeof getStreakData === 'function' ? getStreakData() : { currentStreak: 0, maxStreak: 0 };
                document.getElementById('streakDays').textContent = streak.currentStreak || 0;
                document.getElementById('streakMax').textContent = '最高 ' + (streak.maxStreak || 0) + ' 天';

                var today = new Date().toISOString().slice(0, 10);
                var todayPoints = 0;
                var todayItems = 0;
                for (var i = data.history.length - 1; i >= 0; i--) {
                    var h = data.history[i];
                    if (h.time && h.time.slice(0, 10) === today) {
                        todayPoints += h.points;
                        todayItems++;
                    }
                }
                document.getElementById('todayPoints').textContent = todayPoints;
                document.getElementById('todayItems').textContent = todayItems;
                var goal = 100;
                document.getElementById('dailyGoal').textContent = '目标 ' + Math.min(todayPoints, goal) + '/' + goal;
                document.getElementById('badgeCountTotal').textContent = totalBadgeLevels + ' 徽章';

                // 各科目积分
                var subjectMap = {
                    english: { name: '英语', icon: 'fa-language', color: '#4285f4' },
                    chinese: { name: '语文', icon: 'fa-pen-fancy', color: '#ea4335' },
                    math: { name: '数学', icon: 'fa-calculator', color: '#fbbc05' },
                    pe: { name: '体育', icon: 'fa-running', color: '#34a853' },
                    science: { name: '科学', icon: 'fa-flask', color: '#9b59b6' }
                };
                var subjectsHtml = '';
                for (var key in subjectMap) {
                    var info = subjectMap[key];
                    var pts = data.subjects[key] ? data.subjects[key].points : 0;
                    subjectsHtml += '<div class="points-subject-card">' +
                        '<div class="ps-icon" style="background:' + info.color + '">' +
                            '<i class="fas ' + info.icon + '"></i>' +
                        '</div>' +
                        '<div class="ps-info">' +
                            '<div class="ps-name">' + info.name + '</div>' +
                            '<div class="ps-points">' + pts + ' 分</div>' +
                        '</div>' +
                    '</div>';
                }
                document.getElementById('pointsSubjects').innerHTML = subjectsHtml;

                // 积分记录
                var list = document.getElementById('pointsHistoryList');
                if (data.history.length === 0) {
                    list.innerHTML = '<div class="points-empty"><i class="fas fa-coins"></i><p>暂无积分记录，开始学习赚取积分吧！</p></div>';
                } else {
                    var h = data.history.slice().reverse();
                    var hHtml = '';
                    for (var i = 0; i < Math.min(h.length, 50); i++) {
                        var item = h[i];
                        var time = item.time ? item.time.slice(0, 10) : '';
                        hHtml += '<div class="points-history-item">' +
                            '<span class="ph-reason">' + (item.reason || '学习') + '</span>' +
                            '<span class="ph-time">' + time + '</span>' +
                            '<span class="ph-points">+' + item.points + '</span>' +
                        '</div>';
                    }
                    list.innerHTML = hHtml;
                }
            }
        })();
    </script>
</body>
</html>
