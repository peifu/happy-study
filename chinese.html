<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>/* 主题预热：避免首屏深色闪烁 */ (function(){try{var t=localStorage.getItem('theme')||'light';if(t==='light'||(t==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)){document.documentElement.classList.add('light-theme');}}catch(e){}})();</script>
    <link rel="icon" type="image/png" href="assets/logo/bear.png">
    <meta name="theme-color" content="#ffb347">
    <title>快乐学习 - 诗词</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/learning-assistant.css">
    <style>
        /* 诗词卡片 */
        .poem-card {
            background: var(--card-bg-color);
            border-radius: var(--radius-card);
            padding: 30px;
            box-shadow: var(--shadow-soft);
            position: relative;
            overflow: hidden;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid var(--border-card);
            text-align: center;
        }

        .poem-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-soft), 0 14px 28px var(--glow-warm);
        }

        .poem-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(234, 67, 53, 0.1) 0%, transparent 70%);
            transform: rotate(30deg);
            z-index: 0;
        }

        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }

        .poem-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
        }

        .read-btn {
            background: rgba(234, 67, 53, 0.2);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            color: var(--primary);
        }

        .read-btn:hover {
            background: rgba(234, 67, 53, 0.3);
            transform: scale(1.1);
        }

        .poem-author {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
            font-style: italic;
        }

        .poem-content {
            font-size: 20px;
            line-height: 1.8;
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
        }

        .poem-line {
            margin-bottom: 15px;
            display: block;
        }

        .poem-translation {
            font-style: italic;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
            border-left: 3px solid var(--secondary);
            padding-left: 15px;
            font-size: 16px;
        }

        /* 诗词选集 */
        .poem-selector {
            margin-top: 20px;
        }

        .poem-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .poem-item {
            padding: 12px 15px;
            border-bottom: 1px solid var(--surface-peach);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .poem-item:hover {
            background: rgba(234, 67, 53, 0.1);
        }

        .poem-item.mastered {
            border-left: 4px solid var(--secondary);
        }

        .poem-item.not-mastered {
            border-left: 4px solid var(--danger);
        }

        .poem-item.untouched {
            border-left: 4px solid #999;
        }

        .poem-item .poem-name {
            font-weight: 600;
        }

        .poem-item .poem-author {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0;
        }

        .poem-item-status {
            display: flex;
            justify-content: flex-end;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            background: rgba(231, 76, 60, 0.2);
            color: var(--danger);
        }

        .status-badge.mastered {
            background: rgba(52, 168, 83, 0.2);
            color: var(--secondary);
        }

        .status-badge.untouched {
            background: rgba(153, 153, 153, 0.15);
            color: #999;
        }

        /* 设置页面特有样式 */
        .setting-group {
            margin-bottom: 25px;
        }

        .setting-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .setting-option {
            padding: 12px;
            border-radius: 8px;
            background: var(--surface-peach);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            border: 1px solid var(--border-subtle);
        }

        .setting-option:hover {
            background: rgba(234, 67, 53, 0.1);
        }

        .setting-option.active {
            background: rgba(234, 67, 53, 0.2);
            border-color: var(--primary);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }

        .error-message {
            text-align: center;
            padding: 10px;
            color: var(--primary);
            background: rgba(234, 67, 53, 0.1);
            border-radius: 8px;
            margin-top: 10px;
        }

        /* 响应式 - 页面特有 */
        @media (max-width: 1200px) {
            .poem-card {
                min-height: 350px;
                padding: 25px;
            }
        }

        @media (max-width: 1000px) {
            .poem-card {
                min-height: 320px;
                padding: 20px;
            }
            .poem-title {
                font-size: 26px;
            }
            .poem-content {
                font-size: 18px;
            }
            .poem-translation {
                font-size: 15px;
            }
        }

        @media (max-width: 800px) {
            .poem-card {
                min-height: 300px;
                padding: 18px;
            }
            .poem-title {
                font-size: 24px;
            }
            .poem-content {
                font-size: 17px;
                margin-bottom: 20px;
            }
            .poem-translation {
                font-size: 14px;
                margin-bottom: 20px;
            }
            .poem-list {
                max-height: 250px;
            }
            .poem-item {
                padding: 10px 12px;
            }
        }

        @media (max-width: 600px) {
            .poem-card {
                min-height: 280px;
                padding: 15px;
            }
            .poem-title {
                font-size: 22px;
            }
            .poem-content {
                font-size: 16px;
            }
            .poem-translation {
                font-size: 13px;
            }
            .title-container {
                flex-direction: column;
                gap: 10px;
            }
            .setting-options {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 400px) {
            .poem-card {
                min-height: 250px;
                padding: 12px;
            }
            .poem-title {
                font-size: 20px;
            }
            .poem-content {
                font-size: 15px;
            }
            .poem-translation {
                font-size: 12px;
            }
            .poem-item {
                padding: 8px 10px;
            }
        }

        /* ===== 作文环节 ===== */
        .comp-layout { grid-template-columns: 1fr 350px; align-items: start; }
        .comp-side { position: sticky; top: 90px; }
        .comp-list { max-height: 60vh; }
        .comp-list .poem-item.active { background: rgba(234, 67, 53, 0.12); border-left: 4px solid var(--primary); }
        .comp-detail { display: flex; flex-direction: column; gap: 20px; scroll-margin-top: 90px; }
        .comp-unit-head { font-size: 24px; font-weight: 700; color: var(--primary); margin: 0; }
        .comp-section { background: var(--card-bg-color); border: 1px solid var(--border-card); border-radius: var(--radius-card); box-shadow: var(--shadow-soft); padding: 22px; }
        .comp-section-title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 14px; }
        .comp-sub { font-weight: 700; color: var(--secondary); margin: 14px 0 6px; }
        .comp-section > p { line-height: 1.9; margin: 0; }
        .comp-list-ul { margin: 0; padding-left: 22px; line-height: 1.9; }
        .comp-words { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
        .comp-word { background: var(--surface-peach); border: 1px solid var(--border-subtle); border-radius: var(--radius-pill); padding: 4px 12px; font-size: 14px; }
        .comp-sample-title { font-size: 18px; font-weight: 700; color: var(--text-color); }
        .comp-sample-count { font-size: 13px; color: var(--text-secondary); margin: 4px 0 12px; }
        .comp-sample p { line-height: 2; text-indent: 2em; margin: 0 0 12px; }
        .comp-sample p:last-child { margin-bottom: 0; }
        @media (max-width: 800px) {
            .comp-layout { grid-template-columns: 1fr; }
            .comp-side { position: static; order: -1; }
        }
    </style>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/learning-assistant.js"></script>
</head>
<body data-assistant-mode="study">

    <script>
        const NAV_CONFIG = [
            { page: 'chinese',        icon: 'fa-pen-fancy',    label: '诗词',     active: true },
            { page: 'composition',    icon: 'fa-pen-nib',     label: '作文',     active: false },
            { page: 'daily',          icon: 'fa-calendar-day', label: '日积月累', active: false },
            { page: 'pinyinKnowledge', icon: 'fa-book',        label: '拼音知识', active: false },
            { page: 'settings',       icon: 'fa-cog',          label: '设置',     active: false },
        ];

        // 默认诗词数据（当JSON加载失败时使用）
        const defaultPoemsData = {
            grade1: [
                {
                    title: "静夜思",
                    author: "【唐】李白",
                    content: ["床前明月光，", "疑是地上霜。", "举头望明月，", "低头思故乡。"],
                    translation: "明亮的月光洒在窗户纸上，好像地上泛起了一层霜。我禁不住抬起头来，看那天窗外空中的一轮明月，不由得低头沉思，想起远方的家乡。"
                },
                {
                    title: "春晓",
                    author: "【唐】孟浩然",
                    content: ["春眠不觉晓，", "处处闻啼鸟。", "夜来风雨声，", "花落知多少。"],
                    translation: "春日里贪睡不知不觉天就亮了，到处可以听见小鸟的鸣叫声。回想昨夜的阵阵风雨声，不知吹落了多少娇美的春花。"
                },
                {
                    title: "悯农",
                    author: "【唐】李绅",

                    translation: "盛夏中午，烈日炎炎，农民还在劳作，汗珠滴入泥土。有谁想到，我们碗中的米饭，一粒一粒都是农民辛苦劳动得来的呀？"
                }
            ],
            grade2: [
                {
                    title: "登鹳雀楼",
                    author: "【唐】王之涣",

                    translation: "夕阳依傍着西山慢慢地沉没，滔滔黄河朝着东海汹涌奔流。若想把千里的风光景物看够，那就要登上更高的一层城楼。"

                    title: "望庐山瀑布",

                    translation: "香炉峰在阳光的照射下生起紫色烟霞，从远处看去瀑布好似白色绢绸悬挂山前。高崖上飞腾直落的瀑布好像有几千尺，让人怀疑是银河从天上泻落到人间。"
                }
            ]
        };

        let poemsData = {};
        let currentBook = 'grade1';
        let currentPoemIndex = 0;
        let learnedPoems = {};
        let masteredPoems = {};
        let voiceType = '普通话';
        let currentTheme = localStorage.getItem('theme') || 'light';
        let currentFontSize = 'medium';

        // DOM元素
        const poemTitleElement = document.getElementById('poemTitle');
        const poemAuthorElement = document.getElementById('poemAuthor');
        const poemContentElement = document.getElementById('poemContent');
        const poemTranslationElement = document.getElementById('poemTranslation');
        const bookSelectorElement = document.getElementById('bookSelector');
        const readBtnElement = document.getElementById('readBtn');
        const knowBtnElement = document.getElementById('knowBtn');
        const notKnowBtnElement = document.getElementById('notKnowBtn');
        const nextBtnElement = document.getElementById('nextBtn');
        const prevBtnElement = document.getElementById('prevBtn');
        const totalCountElement = document.getElementById('totalCount');
        const learnedCountElement = document.getElementById('learnedCount');
        const masteredCountElement = document.getElementById('masteredCount');
        const progressFillElement = document.getElementById('progressFill');
        const progressPercentageElement = document.getElementById('progressPercentage');
        const poemListElement = document.getElementById('poemList');
        let navLinks, pages;
        const saveSettingsBtn = document.getElementById('saveSettings');
        const resetSettingsBtn = document.getElementById('resetSettings');

        let dailyData = [];
        let currentDailyIndex = 0;

        // 初始化
        function init() {
            syncThemeFromIndex();
            navLinks = document.querySelectorAll('.nav-link');
            pages = document.querySelectorAll('.page');

            // 加载学习进度
            loadProgress();

            // 加载设置
            loadSettings();

            // 加载诗词数据
            loadPoemsData();

            // 加载日积月累数据
            loadDailyData();

            // 设置事件监听
            setupEventListeners();

            initLearningAssistant();

            // 加载作文数据
            loadCompositionData();
        }

        // 加载诗词数据
        function loadPoemsData() {
            fetch('data/chinese/chinese-poems.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络响应不正常');
                    }
                    return response.json();
                })
                .then(data => {
                    poemsData = data;
                    updateUI();
                })
                .catch(error => {
                    console.error('加载诗词数据失败，使用默认数据:', error);
                    poemsData = defaultPoemsData;
                    showError('加载远程数据失败，使用默认诗词数据');
                    updateUI();
                });
        }

        // 显示错误信息
        function showError(message) {
            const errorElement = document.createElement('div');
            errorElement.className = 'error-message';
            errorElement.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
            poemListElement.innerHTML = '';
            poemListElement.appendChild(errorElement);

            setTimeout(() => {
                errorElement.style.opacity = '0';
                setTimeout(() => {
                    if (poemListElement.contains(errorElement)) {
                        poemListElement.removeChild(errorElement);
                    }
                }, 1000);
            }, 3000);
        }

        // 更新UI
        function updateUI() {
            showCurrentPoem();
            updateProgress();
            updatePoemList();
            applyFontSize();
        }

        // 设置事件监听
        function setupEventListeners() {
            setupNavLinks(navLinks, pages, function(pageId) {
                if (pageId === 'pinyinKnowledge') {
                    window.location.href = 'http://sevenbaby.xyz/pinyin/';
                    return;
                }
            });

            bookSelectorElement.addEventListener('change', handleBookChange);

            readBtnElement.addEventListener('click', readCurrentPoem);
            knowBtnElement.addEventListener('click', markAsMemorized);
            notKnowBtnElement.addEventListener('click', markAsNotMemorized);
            nextBtnElement.addEventListener('click', showNextPoem);
            prevBtnElement.addEventListener('click', showPrevPoem);

            const randomDailyBtn = document.getElementById('randomDailyBtn');
            if (randomDailyBtn) {
                randomDailyBtn.addEventListener('click', showRandomDaily);
            }

            const compGradeSelector = document.getElementById('compGradeSelector');
            if (compGradeSelector) {
                compGradeSelector.addEventListener('change', () => {
                    loadCompositionBook(compGradeSelector.value);
                });
            }

            document.querySelectorAll('.setting-option').forEach(option => {
                option.addEventListener('click', handleSettingOptionClick);
            });

            if (typeof saveSettingsBtn !== 'undefined' && saveSettingsBtn) {
                saveSettingsBtn.addEventListener('click', saveSettings);
            }
            if (typeof resetSettingsBtn !== 'undefined' && resetSettingsBtn) {
                resetSettingsBtn.addEventListener('click', resetSettings);
            }

            setupHomeLink('homeLink', 'index.html');

            const voiceSelectEl = document.getElementById('voiceSelect');
            if (voiceSelectEl) {
                voiceSelectEl.addEventListener('change', () => {
                    localStorage.setItem('selectedVoiceZh', voiceSelectEl.value);
                });
            }
            const voiceTestBtn = document.getElementById('voiceTestBtn');
            if (voiceTestBtn) {
                voiceTestBtn.addEventListener('click', testVoice);
            }

            const rateEl = document.getElementById('speechRateSlider');
            const rateVal = document.getElementById('speechRateValue');
            if (rateEl && rateVal) {
                rateVal.textContent = rateEl.value;
                rateEl.addEventListener('input', () => {
                    rateVal.textContent = rateEl.value;
                    localStorage.setItem('speechRateZh', rateEl.value);
                });
            }
            const pitchEl = document.getElementById('speechPitchSlider');
            const pitchVal = document.getElementById('speechPitchValue');
            if (pitchEl && pitchVal) {
                pitchVal.textContent = pitchEl.value;
                pitchEl.addEventListener('input', () => {
                    pitchVal.textContent = pitchEl.value;
                    localStorage.setItem('speechPitchZh', pitchEl.value);
                });
            }
        }

        // 处理设置选项点击
        function handleSettingOptionClick(e) {
            const option = e.currentTarget;
            const group = option.parentElement;
            const options = group.querySelectorAll('.setting-option');

            options.forEach(opt => opt.classList.remove('active'));
            option.classList.add('active');

            if (group.parentElement.querySelector('.setting-title').textContent.includes('语音')) {
                voiceType = option.getAttribute('data-voice');
            } else if (group.parentElement.querySelector('.setting-title').textContent.includes('主题')) {
                currentTheme = option.getAttribute('data-theme');
            } else if (group.parentElement.querySelector('.setting-title').textContent.includes('字体')) {
                currentFontSize = option.getAttribute('data-fontsize');
            }
        }

        // 保存设置
        function saveSettings() {
            localStorage.setItem('voiceTypeZh', voiceType);
            localStorage.setItem('fontSize', currentFontSize);

            const rateEl = document.getElementById('speechRateSlider');
            const pitchEl = document.getElementById('speechPitchSlider');
            const voiceSelect = document.getElementById('voiceSelect');
            if (rateEl) localStorage.setItem('speechRateZh', rateEl.value);
            if (pitchEl) localStorage.setItem('speechPitchZh', pitchEl.value);
            if (voiceSelect && voiceSelect.value) localStorage.setItem('selectedVoiceZh', voiceSelect.value);

            applyTheme(currentTheme);
            applyFontSize();

            alert('设置已保存！');
        }

        // 重置设置
        function resetSettings() {
            voiceType = '普通话';
            currentTheme = 'light';
            currentFontSize = 'medium';

            document.querySelectorAll('.setting-option').forEach(option => {
                option.classList.remove('active');

                if (option.getAttribute('data-voice') === voiceType) {
                    option.classList.add('active');
                }
                if (option.getAttribute('data-theme') === currentTheme) {
                    option.classList.add('active');
                }
                if (option.getAttribute('data-fontsize') === currentFontSize) {
                    option.classList.add('active');
                }
            });

            applyTheme(currentTheme);
            applyFontSize();

            alert('设置已重置为默认值！');
        }

        // 应用字体大小
        function applyFontSize() {
            if (currentFontSize === 'small') {
                document.documentElement.style.setProperty('--font-size', '14px');
            } else if (currentFontSize === 'medium') {
                document.documentElement.style.setProperty('--font-size', '16px');
            } else if (currentFontSize === 'large') {
                document.documentElement.style.setProperty('--font-size', '18px');
            }
        }

        // 加载设置
        function loadSettings() {
            const savedVoiceType = localStorage.getItem('voiceTypeZh');
            const savedTheme = localStorage.getItem('theme');
            const savedFontSize = localStorage.getItem('fontSize');
            const savedRate = localStorage.getItem('speechRateZh');
            const savedPitch = localStorage.getItem('speechPitchZh');
            const savedVoiceName = localStorage.getItem('selectedVoiceZh');

            if (savedVoiceType) voiceType = savedVoiceType;
            if (savedTheme) currentTheme = savedTheme;
            if (savedFontSize) currentFontSize = savedFontSize;

            if (savedRate && document.getElementById('speechRateSlider')) {
                document.getElementById('speechRateSlider').value = savedRate;
                const rv = document.getElementById('speechRateValue');
                if (rv) rv.textContent = savedRate;
            }
            if (savedPitch && document.getElementById('speechPitchSlider')) {
                document.getElementById('speechPitchSlider').value = savedPitch;
                const pv = document.getElementById('speechPitchValue');
                if (pv) pv.textContent = savedPitch;
            }

            document.querySelectorAll('.setting-option').forEach(option => {
                if (option.getAttribute('data-voice') === voiceType) {
                    option.classList.add('active');
                }
                if (option.getAttribute('data-theme') === currentTheme) {
                    option.classList.add('active');
                }
                if (option.getAttribute('data-fontsize') === currentFontSize) {
                    option.classList.add('active');
                }
            });

            populateVoiceList();
        }

        // 填充发音人选项
        function populateVoiceList() {
            const voiceSelect = document.getElementById('voiceSelect');
            if (!voiceSelect) return;

            while (voiceSelect.options.length > 1) {
                voiceSelect.remove(1);
            }

            const voices = speechSynthesis.getVoices() || [];
            const zhVoices = voices.filter(v => /zh/i.test(v.lang));

            zhVoices.forEach(voice => {
                const option = document.createElement('option');
                option.value = voice.name;
                option.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
            });

            const saved = localStorage.getItem('selectedVoiceZh');
            if (saved) {
                const found = Array.from(voiceSelect.options).find(o => o.value === saved);
                if (found) voiceSelect.value = saved;
            }
        }

        // 测试发音
        function testVoice() {
            const sample = "这是一次语音测试。";
            const ut = new SpeechSynthesisUtterance(sample);
            ut.lang = 'zh-CN';

            const rateEl = document.getElementById('speechRateSlider');
            const pitchEl = document.getElementById('speechPitchSlider');
            if (rateEl) ut.rate = parseFloat(rateEl.value) || 1.0;
            if (pitchEl) ut.pitch = parseFloat(pitchEl.value) || 1.0;

            const savedName = localStorage.getItem('selectedVoiceZh');
            const voiceSelect = document.getElementById('voiceSelect');
            const voices = speechSynthesis.getVoices() || [];

            let v = null;
            if (savedName) v = voices.find(voice => voice.name === savedName);
            if (!v && voiceSelect && voiceSelect.value) v = voices.find(voice => voice.name === voiceSelect.value);
            if (!v) v = voices.find(voice => /zh/i.test(voice.lang));

            if (v) {
                try { ut.voice = v; } catch (e) {}
            }

            speechSynthesis.cancel();
            speechSynthesis.speak(ut);
        }

        // 朗读当前诗词
        function readCurrentPoem() {
            if (!poemsData[currentBook] || !poemsData[currentBook][currentPoemIndex]) {
                return;
            }

            const poemData = poemsData[currentBook][currentPoemIndex];
            const poemText = poemData.content.join(' ');

            const utterance = new SpeechSynthesisUtterance(poemText);
            utterance.lang = 'zh-CN';

            const savedRate = localStorage.getItem('speechRateZh');
            const savedPitch = localStorage.getItem('speechPitchZh');
            const rateEl = document.getElementById('speechRateSlider');
            const pitchEl = document.getElementById('speechPitchSlider');

            if (savedRate) utterance.rate = parseFloat(savedRate);
            else if (rateEl) utterance.rate = parseFloat(rateEl.value) || 0.9;
            else utterance.rate = 0.9;

            if (savedPitch) utterance.pitch = parseFloat(savedPitch);
            else if (pitchEl) utterance.pitch = parseFloat(pitchEl.value) || 1.0;
            else utterance.pitch = 1.0;

            const savedName = localStorage.getItem('selectedVoiceZh');
            const voiceSelect = document.getElementById('voiceSelect');
            const voices = speechSynthesis.getVoices() || [];

            let chosenVoice = null;
            if (savedName) chosenVoice = voices.find(v => v.name === savedName);
            if (!chosenVoice && voiceSelect && voiceSelect.value) chosenVoice = voices.find(v => v.name === voiceSelect.value);
            if (!chosenVoice) chosenVoice = voices.find(v => /zh/i.test(v.lang));

            if (chosenVoice) {
                try { utterance.voice = chosenVoice; } catch (e) { /* ignore */ }
            }

            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
        }

        // 显示当前诗词
        function showCurrentPoem() {
            if (!poemsData[currentBook] || !poemsData[currentBook][currentPoemIndex]) {
                return;
            }

            const poemData = poemsData[currentBook][currentPoemIndex];
            poemTitleElement.textContent = poemData.title;
            poemAuthorElement.textContent = poemData.author;

            poemContentElement.innerHTML = '';

            poemData.content.forEach(line => {
                const lineElement = document.createElement('span');
                lineElement.className = 'poem-line';
                lineElement.textContent = line;
                poemContentElement.appendChild(lineElement);
            });

            poemTranslationElement.textContent = poemData.translation;
        }

        // 标记为已背诵
        function markAsMemorized() {
            if (!poemsData[currentBook] || !poemsData[currentBook][currentPoemIndex]) {
                return;
            }

            const poemTitle = poemsData[currentBook][currentPoemIndex].title;
            const wasAlreadyMemorized = masteredPoems[poemTitle] === true;
            masteredPoems[poemTitle] = true;
            learnedPoems[poemTitle] = true;
            saveProgress();
            updateProgress();
            updatePoemList();
            // 首次背诵才奖励积分
            if (!wasAlreadyMemorized && typeof addStudyPoints === 'function') {
                addStudyPoints('chinese', 20, '背诵古诗: ' + poemTitle);
            }
            showNextPoem();
        }

        // 标记为未掌握
        function markAsNotMemorized() {
            if (!poemsData[currentBook] || !poemsData[currentBook][currentPoemIndex]) {
                return;
            }

            const poemTitle = poemsData[currentBook][currentPoemIndex].title;
            masteredPoems[poemTitle] = false;
            learnedPoems[poemTitle] = true;
            saveProgress();
            updateProgress();
            updatePoemList();
            showNextPoem();
        }

        // 显示下一首诗词
        function showNextPoem() {
            if (!poemsData[currentBook]) {
                return;
            }

            currentPoemIndex = (currentPoemIndex + 1) % poemsData[currentBook].length;
            showCurrentPoem();
        }

        // 显示上一首诗词
        function showPrevPoem() {
            if (!poemsData[currentBook]) {
                return;
            }

            currentPoemIndex = (currentPoemIndex - 1 + poemsData[currentBook].length) % poemsData[currentBook].length;
            showCurrentPoem();
        }

        // 处理诗词本变更
        function handleBookChange() {
            currentBook = bookSelectorElement.value;
            currentPoemIndex = 0;
            showCurrentPoem();
            updateProgress();
            updatePoemList();
        }

        // 更新进度显示
        function updateProgress() {
            if (!poemsData[currentBook]) {
                return;
            }

            const totalPoems = poemsData[currentBook].length;
            const learned = Object.keys(learnedPoems).filter(title =>
                poemsData[currentBook].some(p => p.title === title)
            ).length;
            const mastered = Object.keys(masteredPoems).filter(title =>
                masteredPoems[title] && poemsData[currentBook].some(p => p.title === title)
            ).length;

            totalCountElement.textContent = totalPoems;
            learnedCountElement.textContent = learned;
            masteredCountElement.textContent = mastered;

            const progress = totalPoems > 0 ? (learned / totalPoems) * 100 : 0;
            progressFillElement.style.width = `${progress}%`;
            progressPercentageElement.textContent = `${Math.round(progress)}%`;
        }

        // 更新诗词列表显示
        function updatePoemList() {
            if (!poemsData[currentBook]) {
                poemListElement.innerHTML = '<div class="error-message">暂无诗词数据</div>';
                return;
            }

            poemListElement.innerHTML = '';

            poemsData[currentBook].forEach((poem, index) => {
                const poemItem = document.createElement('div');
                poemItem.className = 'poem-item';

                if (masteredPoems[poem.title]) {
                    poemItem.classList.add('mastered');
                } else if (learnedPoems[poem.title]) {
                    poemItem.classList.add('not-mastered');
                }

                const isMastered = masteredPoems[poem.title];
                const isLearned = learnedPoems[poem.title];
                let badgeText = '未学习';
                let badgeClass = 'untouched';
                if (isMastered) {
                    badgeText = '已背诵';
                    badgeClass = 'mastered';
                } else if (isLearned) {
                    badgeText = '未掌握';
                    badgeClass = '';
                } else {
                    poemItem.classList.add('untouched');
                }

                poemItem.innerHTML = `
                    <div>
                        <div class="poem-name">${poem.title}</div>
                        <div class="poem-author">${poem.author.replace('【', '').replace('】', '')}</div>
                    </div>
                    <div class="poem-item-status">
                        <div class="status-badge${badgeClass ? ' ' + badgeClass : ''}">${badgeText}</div>
                    </div>
                `;

                poemItem.addEventListener('click', () => {
                    currentPoemIndex = index;
                    showCurrentPoem();
                });

                poemListElement.appendChild(poemItem);
            });
        }

        // 保存进度到本地存储
        function saveProgress() {
            localStorage.setItem('learnedPoems', JSON.stringify(learnedPoems));
            localStorage.setItem('masteredPoems', JSON.stringify(masteredPoems));
        }

        // 从本地存储加载进度
        function loadProgress() {
            const learned = localStorage.getItem('learnedPoems');
            const mastered = localStorage.getItem('masteredPoems');

            if (learned) {
                learnedPoems = JSON.parse(learned);
            }

            if (mastered) {
                masteredPoems = JSON.parse(mastered);
            }
        }

        // 加载日积月累数据
        function loadDailyData() {
            fetch('data/chinese/daily-accumulation.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('网络响应不正常');
                    }
                    return response.json();
                })
                .then(data => {
                    dailyData = data.collections;
                    showRandomDaily();
                })
                .catch(error => {
                    console.error('加载日积月累数据失败:', error);
                    dailyData = [
                        {
                            content: "读书破万卷，下笔如有神。",
                            author: "杜甫",
                            translation: "形容博览群书，把书读透，这样落实到笔下，运用起来就会得心应手。"
                        }
                    ];
                    showRandomDaily();
                });
        }

        // 显示随机的日积月累内容
        function showRandomDaily() {
            if (dailyData.length === 0) return;

            let randomIndex;
            if (dailyData.length > 1) {
                do {
                    randomIndex = Math.floor(Math.random() * dailyData.length);
                } while (randomIndex === currentDailyIndex && dailyData.length > 1);
            } else {
                randomIndex = 0;
            }

            currentDailyIndex = randomIndex;
            const dailyItem = dailyData[currentDailyIndex];

            const dailyContentElement = document.getElementById('dailyContent');
            const dailyTranslationElement = document.getElementById('dailyTranslation');

            if (dailyContentElement && dailyTranslationElement) {
                dailyContentElement.innerHTML = `
                    <span class="poem-line">${dailyItem.content}</span>
                    <span class="poem-line">——${dailyItem.author}</span>
                `;
                dailyTranslationElement.textContent = dailyItem.translation;
            }
        }

        // ===== 作文环节 =====
        let compositionData = null;
        let compositionIndex = [];
        let currentCompBook = '';

        function cnUnitNum(n) {
            const cn = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
            return cn[n - 1] || n;
        }

        function loadCompositionData() {
            // 先加载作文索引，仅填充实际存在的年级到选择器
            fetch('data/chinese/composition-index.json')
                .then(response => {
                    if (!response.ok) throw new Error('作文索引加载失败');
                    return response.json();
                })
                .then(index => {
                    compositionIndex = Array.isArray(index) ? index : [];
                    const selector = document.getElementById('compGradeSelector');
                    if (selector) {
                        selector.innerHTML = '';
                        compositionIndex.forEach(entry => {
                            const opt = document.createElement('option');
                            opt.value = entry.id;
                            opt.textContent = entry.title;
                            selector.appendChild(opt);
                        });
                    }
                    if (compositionIndex.length === 0) {
                        const listEl = document.getElementById('compUnitList');
                        if (listEl) listEl.innerHTML = '<div class="error-message">暂无作文数据</div>';
                        return;
                    }
                    loadCompositionBook(compositionIndex[0].id);
                })
                .catch(error => {
                    console.error('加载作文索引失败:', error);
                    loadCompositionBook('grade4a');
                });
        }

        function loadCompositionBook(bookId) {
            const entry = compositionIndex.find(e => e.id === bookId);
            const file = entry ? entry.file : `data/chinese/composition-${bookId}.json`;
            currentCompBook = bookId;

            const selector = document.getElementById('compGradeSelector');
            if (selector && selector.value !== bookId) selector.value = bookId;

            const listEl = document.getElementById('compUnitList');
            if (listEl) listEl.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><span>加载作文列表...</span></div>';
            const detailEl = document.getElementById('compDetail');
            if (detailEl) detailEl.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><span>加载中...</span></div>';

            fetch(file)
                .then(response => {
                    if (!response.ok) throw new Error('作文数据加载失败');
                    return response.json();
                })
                .then(data => {
                    compositionData = data;
                    renderCompUnitList();
                    showCompUnit(0);
                })
                .catch(error => {
                    console.error('加载作文数据失败:', error);
                    if (listEl) listEl.innerHTML = '<div class="error-message">作文数据加载失败</div>';
                    if (detailEl) detailEl.innerHTML = '<div class="error-message">作文数据加载失败</div>';
                });
        }

        function renderCompUnitList() {
            const listEl = document.getElementById('compUnitList');
            if (!listEl || !compositionData) return;

            listEl.innerHTML = '';
            compositionData.units.forEach((unit, index) => {
                const item = document.createElement('div');
                item.className = 'poem-item';
                item.innerHTML = `
                    <div>
                        <div class="poem-name">${unit.name}</div>
                        <div class="poem-author">第${cnUnitNum(unit.no)}单元</div>
                    </div>
                `;
                item.addEventListener('click', () => {
                    showCompUnit(index);
                    scrollCompDetailToTop();
                });
                listEl.appendChild(item);
            });
        }

        function scrollCompDetailToTop() {
            const detailEl = document.getElementById('compDetail');
            if (!detailEl) return;
            if (typeof detailEl.scrollIntoView === 'function') {
                detailEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function showCompUnit(index) {
            if (!compositionData || !compositionData.units[index]) return;
            const unit = compositionData.units[index];

            document.querySelectorAll('#compUnitList .poem-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            let html = '';

            html += '<div class="comp-section"><div class="comp-section-title"><i class="fas fa-lightbulb"></i>写作指南</div>';
            if (unit.requirements) {
                html += `<div class="comp-sub">写作要求</div><p>${unit.requirements}</p>`;
            }
            if (unit.format && unit.format.length) {
                html += '<div class="comp-sub">书信格式</div><ul class="comp-list-ul">' +
                    unit.format.map(x => `<li>${x}</li>`).join('') + '</ul>';
            }
            if (unit.ideas && unit.ideas.length) {
                html += '<div class="comp-sub">写作思路</div><ul class="comp-list-ul">' +
                    unit.ideas.map(x => `<li>${x}</li>`).join('') + '</ul>';
            }
            if (unit.goodWords && unit.goodWords.length) {
                html += '<div class="comp-sub">高分好词</div><div class="comp-words">' +
                    unit.goodWords.map(x => `<span class="comp-word">${x}</span>`).join('') + '</div>';
            }
            if (unit.cautions && unit.cautions.length) {
                html += '<div class="comp-sub">注意事项（避坑）</div><ul class="comp-list-ul">' +
                    unit.cautions.map(x => `<li>${x}</li>`).join('') + '</ul>';
            }
            html += '</div>';

            if (unit.sample) {
                html += '<div class="comp-section"><div class="comp-section-title"><i class="fas fa-star"></i>满分范文</div>' +
                    `<div class="comp-sample-title">${unit.sample.title}</div>` +
                    (unit.sample.wordCount ? `<div class="comp-sample-count">约 ${unit.sample.wordCount} 字</div>` : '') +
                    '<div class="comp-sample">' + unit.sample.paragraphs.map(p => `<p>${p}</p>`).join('') + '</div></div>';
            }

            const tips = compositionData.generalTips || [];
            if (tips.length) {
                html += '<div class="comp-section"><div class="comp-section-title"><i class="fas fa-triangle-exclamation"></i>通用满分注意事项</div><ul class="comp-list-ul">' +
                    tips.map(x => `<li>${x}</li>`).join('') + '</ul></div>';
            }

            document.getElementById('compDetail').innerHTML = html;
        }

        // 初始化应用
        (function () {
            injectNav(NAV_CONFIG);
            injectFooter();
            injectAssistant();
            init();
        })();

        // 确保 voiceschanged 时也填充中文发音列表
        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }
    </script>
